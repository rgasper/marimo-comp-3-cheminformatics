[project]
name = "fingerprints-notebook"
version = "1.0.0"
description = "Molecular fingerprints, made tangible — a molab notebook (OpenADMET × marimo)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # notebook + UI
    "marimo>=0.24.0",
    "anywidget>=0.11.0",
    "altair>=5.4",
    "pandas>=2.2",
    # chemistry + numerics
    "rdkit>=2024.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "polars>=1.20",
    "pillow>=11",
    "requests>=2.32",
    # small utilities used by the data loaders / analyses
    "loguru>=0.7",
    "typeguard>=4.3",
    "tqdm>=4.66",
    # neural fingerprint (CheMeleon) — used live in the interactive cells and
    # in the optional "recompute" path
    "torch>=2.6",
    "chemprop>=2.2.0",
]

# Only needed to *regenerate* the 3D Boltz poses / PLIP interaction data, which
# ships precomputed under data/boltz_poses. Not required to run the notebook.
[project.optional-dependencies]
poses = [
    "boltz-api>=0.50.0",
    "plip>=3.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerprints"]
